<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApptoDoctor – Find doctors near you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10283c; --muted:#5d7080; --line:#dbe6ea; --mist:#eef5f6; --paper:#ffffff;
  --teal:#0b7f84; --teal-dark:#075f63; --teal-soft:#d9f0f0; --amber:#f2a93b; --danger:#b3261e;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--mist);line-height:1.5}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* header */
header{background:var(--ink);color:#fff}
.bar{max-width:1180px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--amber);color:var(--ink);display:grid;place-items:center;font:800 24px var(--head)}
.brand{font:700 22px var(--head);letter-spacing:-.01em}
.hero{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
.hero h1{font:800 clamp(28px,4.5vw,46px)/1.1 var(--head);letter-spacing:-.02em;max-width:640px}
.hero p{color:#b9cbd6;margin-top:10px;max-width:520px}
.finder{display:flex;gap:10px;margin-top:22px;max-width:560px;background:#fff;padding:8px;border-radius:16px}
.finder input{flex:1;border:0;padding:10px 12px;font-size:16px;background:transparent;min-width:0}
.finder input:focus-visible{outline:none}
.btn{border:0;border-radius:10px;padding:10px 20px;background:var(--teal);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--teal-dark)}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.ghost:hover{background:var(--teal-soft)}

/* layout */
main{max-width:1180px;margin:-22px auto 60px;padding:0 20px;display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
aside{background:var(--paper);border-radius:18px;padding:20px;border:1px solid var(--line);position:sticky;top:16px}
aside h2{font:700 18px var(--head)}
.f{margin-top:16px}
.f label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.f input[type=text],.f input[type=search],.f select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.f input[type=range]{width:100%;accent-color:var(--teal)}
.fee-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.fee-row b{color:var(--ink)}
.side-head{display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--teal);font-weight:600;cursor:pointer;padding:4px}
.toggle{display:none}

/* results */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-top:30px}
.top h2{font:700 20px var(--head)}
.top h2 span{color:var(--muted);font:500 15px var(--body)}
.sort{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 10px 28px rgba(16,40,60,.1);transform:translateY(-2px)}
.who{display:flex;gap:14px;align-items:center}
.av{width:68px;height:68px;border-radius:16px;object-fit:cover;flex:none;background:var(--teal-soft);color:var(--teal-dark);display:grid;place-items:center;font:700 24px var(--head)}
.who h3{font:700 18px var(--head);line-height:1.2}
.spec{display:inline-block;margin-top:4px;background:var(--teal-soft);color:var(--teal-dark);font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px}
.qual{font-size:14px;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px}
.facts div{padding:10px 12px}
.facts div+div{border-left:1px solid var(--line)}
.facts small{display:block;color:var(--muted);font-size:12px}
.facts strong{font:700 17px var(--head)}
.loc{font-size:14px;color:var(--muted)}
.loc b{color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:auto}
.actions a{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:9px 10px;font-weight:600;font-size:14px}
.actions .call{background:var(--teal);color:#fff}
.actions .call:hover{background:var(--teal-dark)}
.actions .mail{border:1.5px solid var(--teal);color:var(--teal)}
.actions .mail:hover{background:var(--teal-soft)}

/* states */
.state{background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:48px 24px;text-align:center;grid-column:1/-1}
.state h3{font:700 20px var(--head);margin-bottom:6px}
.state p{color:var(--muted);max-width:460px;margin:0 auto 14px}
.state.err h3{color:var(--danger)}
.sk{height:300px;border-radius:18px;background:linear-gradient(90deg,#e4eef0 25%,#f3f8f9 50%,#e4eef0 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.demo{background:var(--amber);color:var(--ink);font-size:13px;font-weight:600;text-align:center;padding:6px 12px}

.actions button{flex:1;border:0;border-radius:10px;padding:11px 10px;font-weight:600;background:var(--teal);color:#fff;cursor:pointer}
.actions button:hover{background:var(--teal-dark)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:10}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr))}
.who>div,.card{min-width:0}
.who h3,.loc,.qual{overflow-wrap:anywhere}
@media (max-width:1024px){
  main{grid-template-columns:240px 1fr;gap:18px}
}
@media (max-width:860px){
  main{grid-template-columns:1fr;margin-top:-16px;padding:0 16px}
  aside{position:static;display:none}
  aside.open{display:block}
  .toggle{display:inline-block}
  .top{padding-top:22px}
  .bar,.hero{padding-left:16px;padding-right:16px}
  .hero{padding-bottom:32px}
}
@media (max-width:520px){
  .brand{font-size:19px}
  .logo{width:36px;height:36px;font-size:21px}
  .hero h1{font-size:26px}
  .hero p{font-size:14px}
  .top{flex-direction:column;align-items:stretch;gap:10px}
  .top>div{width:100%}
  .top .sort{flex:1;min-width:0}
  .grid{gap:12px}
  .card{padding:14px;border-radius:16px}
  .av{width:58px;height:58px;font-size:20px}
  .who h3{font-size:17px}
  .facts div{padding:8px 10px}
  .actions button{padding:13px 10px}
  .toast{width:calc(100% - 32px);text-align:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo" aria-hidden="true">A</div>
    <div class="brand">ApptoDoctor</div>
  </div>
  <div class="hero">
    <h1 id="heroTitle">Find the right doctor</h1>
    <p>Filter by specialization, experience, fees and PIN code, then book your appointment.</p>
  </div>
</header>

<main>
  <aside id="filters" aria-label="Filters">
    <div class="side-head"><h2>Filters</h2><button class="link" id="reset" type="button">Reset all</button></div>

    <div class="f"><label for="q">Doctor or clinic name</label>
      <input id="q" type="search" placeholder="Search name or clinic"></div>

    <div class="f"><label for="city">City</label>
      <select id="city"><option value="">All cities</option></select></div>

    <div class="f"><label for="pin">PIN code</label>
      <input id="pin" type="text" inputmode="numeric" maxlength="6" placeholder="e.g. 400001"></div>

    <div class="f"><label for="spec">Specialization</label>
      <select id="spec"><option value="">All specializations</option></select></div>

    <div class="f"><label for="exp">Experience</label>
      <select id="exp">
        <option value="0">Any</option>
        <option value="2">2+ years</option>
        <option value="5">5+ years</option>
        <option value="10">10+ years</option>
        <option value="15">15+ years</option>
        <option value="20">20+ years</option>
      </select></div>

    <div class="f"><label for="fee">Maximum consultation fee</label>
      <input id="fee" type="range" min="0" max="2000" step="50" value="2000">
      <div class="fee-row"><span>₹0</span><b id="feeVal">Any</b></div></div>
  </aside>

  <section>
    <div class="top">
      <h2 id="count">Doctors <span></span></h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn ghost toggle" id="toggle" type="button">Filters</button>
        <select class="sort" id="sort" aria-label="Sort doctors">
          <option value="">Sort: Recommended</option>
          <option value="feeAsc">Fee: low to high</option>
          <option value="feeDesc">Fee: high to low</option>
          <option value="expDesc">Experience: high to low</option>
          <option value="name">Name: A to Z</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </section>
</main>

<script>
/* ============ CONFIG – edit these ============ */
const CONFIG = {
  // Paste your Power Automate "When an HTTP request is received" URL here.
  FLOW_URL: "https://3194f3baa5b1e555a57785512f7ae2.da.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/01/workflows/8a89c94de3fb4b0eaf8f247ea24ec2b2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ClpovYqD7NclPhpZYcggkR6GkgIjpXvLSqmzGk6StEY",
  // Must match the trigger's Method in your flow: "POST" (default trigger) or "GET".
  METHOD: "POST",
  // The query parameter name your flow reads for the city.
  PARAM_NAME: "location",
  // URL parameters accepted by this page: ?location=Mumbai  (or ?city=Mumbai)
  DEFAULT_LOCATION: "",
  // Page opened by "Book appointment". Opens: BOOK_URL?ID=<doctor id>
  BOOK_URL: "appointments",
  CURRENCY: "₹",
  SHOW_INACTIVE: false
};
/* ============================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ALL = [];

/* ---------- Field mapping (works with Dataverse logical names, display names, or aliases) ---------- */
const ALIASES = {
  name:["doctorname","name","fullname"],
  email:["email","emailaddress"],
  phone:["phone","mobile","phonenumber","contact"],
  spec:["specialization","specialisation","speciality","specialty"],
  qual:["qualification","qualifications"],
  exp:["experience","yearsofexperience","experienceyears"],
  fee:["consultationfee","fee","fees"],
  clinic:["clinicname","clinic"],
  address:["address","clinicaddress"],
  city:["city"],
  pin:["pincode","pin","zipcode","postalcode"],
  img:["doctorimageurl","doctorimgurl","profileimageurl","imageurl","imgurl","doctorimage","profileimage","image","photo","profilepicture"],
  id:["doctorid","id","contactid"],
  active:["isactive","active","status"]
};
const norm = k => String(k).toLowerCase().replace(/^[a-z0-9]{2,8}_(?=[a-z])/,"").replace(/[^a-z0-9]/g,"");

function mapRow(raw){
  const flat = {};
  for(const k in raw){ if(k.includes("@")) continue; flat[norm(k)] = raw[k]; }
  const pick = field => { for(const a of ALIASES[field]) if(flat[a]!==undefined && flat[a]!==null) return flat[a]; return ""; };
  const num = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g,"")); return isNaN(n)?0:n; };
  const act = pick("active");
  return {
    name:String(pick("name")).trim(), email:String(pick("email")).trim(), phone:String(pick("phone")).trim(),
    spec:String(pick("spec")).trim(), qual:String(pick("qual")).trim(), exp:num(pick("exp")), fee:num(pick("fee")),
    clinic:String(pick("clinic")).trim(), address:String(pick("address")).trim(), city:String(pick("city")).trim(),
    pin:String(pick("pin")).trim(), img:imgSrc(pick("img")), id:String(pick("id")).trim(),
    active: act===""||act===undefined ? true : ["true","yes","1","active"].includes(String(act).toLowerCase())
  };
}
function imgSrc(v){
  if(!v) return "";
  v = String(v);
  if(/^(https?:|data:|\/)/i.test(v)) return v;
  if(/^[A-Za-z0-9+/=\s]{100,}$/.test(v)) return "data:image/jpeg;base64,"+v.replace(/\s/g,""); // Dataverse image column (base64)
  return "";
}

/* ---------- Parse flow response: JSON array, {value:[]}, {doctors:[]}, or an HTML table ---------- */
function parseResponse(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ return parseHtmlTable(text); }
  if(typeof data==="string") return parseResponse(data);
  if(Array.isArray(data)) return data;
  for(const key of ["value","doctors","body","data","rows"]){ if(data && data[key]!==undefined) return parseResponse(typeof data[key]==="string"?data[key]:JSON.stringify(data[key])); }
  return [];
}
function parseHtmlTable(html){
  const doc = new DOMParser().parseFromString(html,"text/html");
  const table = doc.querySelector("table"); if(!table) return [];
  const rows = [...table.querySelectorAll("tr")];
  const heads = [...rows[0].children].map(c=>c.textContent.trim());
  return rows.slice(1).map(r=>{
    const o={}; [...r.children].forEach((c,i)=>{ const im=c.querySelector("img"); o[heads[i]] = im? im.getAttribute("src") : c.textContent.trim(); }); return o;
  });
}

/* ---------- Load data ---------- */
async function load(location){
  showSkeleton();
  try{
    if(!CONFIG.FLOW_URL) throw new Error("FLOW_URL is empty. Paste your Power Automate HTTP URL in CONFIG.");
    const sep = CONFIG.FLOW_URL.includes("?") ? "&" : "?";
    const res = await fetch(CONFIG.FLOW_URL + sep + encodeURIComponent(CONFIG.PARAM_NAME) + "=" + encodeURIComponent(location||""), { method: CONFIG.METHOD });
    if(!res.ok){
      const detail = (await res.text().catch(()=>"")).slice(0,300);
      throw new Error("Status " + res.status + (detail ? ": " + detail : "."));
    }
    const rows = parseResponse(await res.text());
    ALL = rows.map(mapRow).filter(d => d.name && (CONFIG.SHOW_INACTIVE || d.active));
    setupFilters();
    render();
  }catch(err){
    $("grid").innerHTML = `<div class="state err"><h3>Couldn't load doctors</h3><p>${esc(err.message)} Check the Internet, make sure the Internet is turned on.</p><button class="btn" onclick="load(getLocation())">Try again</button></div>`;
    $("count").innerHTML = "Doctors <span></span>";
  }
}
function showSkeleton(){ $("grid").innerHTML = '<div class="sk"></div>'.repeat(6); }

/* ---------- Filters ---------- */
function setupFilters(){
  const fill = (el, values, label) => {
    const prev = el.value;
    el.innerHTML = `<option value="">${label}</option>` + values.map(v=>`<option>${esc(v)}</option>`).join("");
    if(values.includes(prev)) el.value = prev;
  };
  const uniq = key => [...new Set(ALL.map(d=>d[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  fill($("city"), uniq("city"), "All cities");
  fill($("spec"), uniq("spec"), "All specializations");
  const maxFee = Math.max(500, Math.ceil(Math.max(0,...ALL.map(d=>d.fee))/50)*50);
  $("fee").max = maxFee; $("fee").value = maxFee; updateFeeLabel();
}
function updateFeeLabel(){
  const f=$("fee"); $("feeVal").textContent = (+f.value>=+f.max) ? "Any" : "Up to " + CONFIG.CURRENCY + f.value;
}
function filtered(){
  const q=$("q").value.trim().toLowerCase(), city=$("city").value, pin=$("pin").value.trim(),
        spec=$("spec").value, exp=+$("exp").value, fee=+$("fee").value, anyFee=fee>=+$("fee").max;
  let list = ALL.filter(d =>
    (!q || (d.name+" "+d.clinic).toLowerCase().includes(q)) &&
    (!city || d.city===city) &&
    (!pin || d.pin.startsWith(pin)) &&
    (!spec || d.spec===spec) &&
    d.exp>=exp &&
    (anyFee || d.fee<=fee)
  );
  const s=$("sort").value;
  if(s==="feeAsc") list.sort((a,b)=>a.fee-b.fee);
  if(s==="feeDesc") list.sort((a,b)=>b.fee-a.fee);
  if(s==="expDesc") list.sort((a,b)=>b.exp-a.exp);
  if(s==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
  return list;
}

/* ---------- Render ---------- */
const initials = n => n.replace(/^dr\.?\s*/i,"").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
function card(d,i){
  const av = d.img ? `<img class="av" src="${esc(d.img)}" alt="${esc(d.name)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;av&quot;>${esc(initials(d.name))}</div>'">`
                   : `<div class="av">${esc(initials(d.name))}</div>`;
  const place = [d.address, d.city].filter(Boolean).join(", ") + (d.pin ? " – " + d.pin : "");
  return `<article class="card">
    <div class="who">${av}<div><h3>${esc(d.name)}</h3>${d.spec?`<span class="spec">${esc(d.spec)}</span>`:""}</div></div>
    ${d.qual?`<div class="qual">${esc(d.qual)}</div>`:""}
    <div class="facts">
      <div><small>Experience</small><strong>${d.exp} yrs</strong></div>
      <div><small>Consultation fee</small><strong>${d.fee?CONFIG.CURRENCY+d.fee.toLocaleString("en-IN"):"On request"}</strong></div>
    </div>
    <div class="loc">${d.clinic?`<b>${esc(d.clinic)}</b><br>`:""}${esc(place)}</div>
    <div class="actions"><button type="button" onclick="onBook(${i})">Book appointment</button></div>
  </article>`;
}
function render(){
  const list = filtered();
  $("count").innerHTML = `Doctors <span>(${list.length} found)</span>`;
  $("grid").innerHTML = list.length ? list.map(d=>card(d,ALL.indexOf(d))).join("") :
    `<div class="state"><h3>No doctors match these filters</h3><p>Try a higher fee limit, lower experience, or clear the PIN code.</p><button class="btn" onclick="resetFilters()">Reset filters</button></div>`;
}
function resetFilters(){
  $("q").value=""; $("city").value=""; $("pin").value=""; $("spec").value=""; $("exp").value="0"; $("sort").value="";
  $("fee").value=$("fee").max; updateFeeLabel(); render();
}

/* ---------- Events ---------- */
["q","pin"].forEach(id=>$(id).addEventListener("input",render));
["city","spec","exp","sort"].forEach(id=>$(id).addEventListener("change",render));
$("pin").addEventListener("input",e=>{ e.target.value=e.target.value.replace(/\D/g,""); });
$("fee").addEventListener("input",()=>{ updateFeeLabel(); render(); });
$("reset").addEventListener("click",resetFilters);
$("toggle").addEventListener("click",()=>$("filters").classList.toggle("open"));

/* ---------- Book appointment ---------- */
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),3500);
}
function onBook(i){
  const d=ALL[i]; if(!d) return;
  if(!d.id){ toast("This doctor has no ID, so booking can't open."); return; }
  location.href = CONFIG.BOOK_URL + "?ID=" + encodeURIComponent(d.id);
}

/* ---------- Start: runs the flow as soon as the page opens ---------- */
function getLocation(){
  const p=new URLSearchParams(location.search);
  return (p.get("location")||p.get("city")||CONFIG.DEFAULT_LOCATION||"").trim();
}
(function init(){
  const loc=getLocation();
  if(loc) $("heroTitle").textContent="Doctors in "+loc;
  load(loc);
})();
</script>
</body>
</html>
